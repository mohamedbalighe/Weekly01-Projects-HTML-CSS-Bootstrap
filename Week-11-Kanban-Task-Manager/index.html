<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <title>Kanban | Task Manager</title>
    <link href="css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar bg-body-tertiary position-relative">
      <div class="container-fluid">
        <a class="navbar-brand fw-bolder fs-4" href="#">
          <i class="fa-solid fa-table-columns text-2xl pe-1"></i> Kanban
        </a>
      </div>
      <button type="button" class="btn button text-white fs-5 d-flex align-items-center justify-content-center position-absolute " 
                data-bs-toggle="modal" 
                data-bs-target="#exampleModal" 
                style="background-color: #A748FB; width: 40px; height: 40px; border-radius: 8px;">
          <i class="fa-solid fa-plus"></i>
        </button>
    </nav>

    <div
      class="modal fade "
      id="exampleModal"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
      
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">
              Create New Task
            </h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>

          <div class="modal-body">
            <div class="mb-3">
              <label for="FullName"  class="form-label" ><i class="fa-solid fa-h me-1" style="color:#9EADC2;"></i> Task Title <span class="required-star" style="color: red;">*</span></label>
              <input
                type="text"
                class="form-control task-input TaskName"
                id="TaskName"
                placeholder="what's needs to be done?"
              />
              <div id="nameAlert" class="alert alert-danger p-2 mt-2 d-none">Title must start with a capital letter and be at least 3 characters</div>
            </div>

           <div class="editing d-flex gap-2">
             <div class="groupe-select mb-3 flex-fill">
              <label for="groupSelect" class="form-label"><i class="fa-solid fa-flag me-2" style="color: #90A1B9;"> </i> Priority</label>
              <select class="form-select py-3 px-2" id="groupSelect">
                <option value="Low">Low</option>
                <option value="Meduim">Meduim</option>
                <option value="High">High</option>
              </select>
            </div>

            <div class="mb-3 flex-fill">
              <label for="Date" class="form-label"><i class="fa-regular fa-calendar me-2" style="color: #C9D1DD;"></i> Due Date</label>
              <input
                type="date"
                class="form-control1 py-3 px-2"
                id="date"
                
              />
            </div>
        
           
            </div>

            <div class="mb-3">
              <label for="message-text" class="col-form-label">Description:</label>
              <textarea
                class="form-control task-input pb-4"
                id="message"
                placeholder="Add Notes About this one"
              ></textarea>
            </div>

            
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn2 btn-dark"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button
              type="button"
              id="AddB"
              class="btn btn1  btn-warning" 
            >
              <i class="fa-solid fa-plus"></i> Add Task
            </button>
           
          </div>
        </div>
      </div>
    </div>



<section>
    <div class="container text-center">
  <div class="row  mt-5 gap-3 flex-nowrap">
    <div class="col-4 The-columans border border-2 rounded-4  px-4 py-4 ">

      <div class="box first-box ">
        <div class="iconAnd-type d-flex ">
          <div class="toDo-icon px-1 py-1 bg-light rounded-3 "><i class="fa-solid clipboard fa-clipboard-list fs-5 py-2 px-2 rounded-3"></i></div>
          <div class="toDo-Word ms-2 ">
            <h6 class="m-0 fw-bold">To Do</h6>
            <p class="Taskat m-0 text-secondary ">tasks</p>
          </div>
        </div>
        <div class="The-Box-Inside rounded-3 " id="todo-col">
          <div class="All-Data rounded-3 my-3 px-3">
          <div class="spot-and-Buttons d-flex justify-content-between mb-2">
          <div class="Spot-And-indexing d-flex gap-2 mt-3">
            <div class="spot-icon "><i class="fa-solid spot fa-circle"></i></div>
            <h6 class="Box-indexing ">#000</h6>
            </div>
            <div class="The-Buttons">
              <button type="button" id="Edit" class="btn Edit-Task-button btn-secondary"><i class="fa-solid fa-pen"></i></button>
              <button type="button" id="Delete" class="btn Delet-button btn-primary"><i class="fa-regular fa-trash-can"></i></button>
            </div>
          </div>
          <div class="User-inputs-And-Buttons text-start d-flex flex-column gap-2">
            <div class="Task-name fw-bold">Cheer</div>
             <div class="alert alert-danger p-2 mt-2 d-none">Title must be at least 3 characters</div>

              <p class="Task-Description m-0">Need it as soon as poisple</p>
                <div class="Task-Priority d-flex gap-2"><i class="fa-solid spot2 fa-circle mt-2"></i>Small</div>
                <div class="Task-Date-and-time-adding d-flex gap-2 mb-2">
                  <div class="task-date me-2"><i class="fa-regular fa-calendar me-2"></i>Jul 2</div>
                  <h6 class="time-adding"><i class="fa-regular fa-clock me-2"></i> just now</h6>
                </div>
                <div class="The-Buttons-2">
                  <button type="button" id="Start" class="btn btn-danger"><i class="fa-solid fa-play me-2 "></i>Start</button>
                  <button type="button" id="Complet" class="btn btn-success fw-bolder"><i class="fa-solid fa-check me-2 fw-bolder"></i>Complet</button>
                </div>
          </div>
          
          </div>
        </div>
      </div>

    </div>
    <div class="col-4 The-columans border border-2 rounded-4  px-4 py-4">
      <div class="box second-box Data">
        <div class="iconAnd-type d-flex ">
          <div class="toDo-icon px-1 py-1 bg-light rounded-3 "><i class="fa-solid spinner-icon  fa-spinner text-amber-500 text-lg fs-5 py-2 px-2 rounded-3"></i></div>
          <div class="toDo-Word ms-2 ">
            <h6 class="m-0 fw-bold">In Progress</h6>
            <p class="m-0 text-secondary ">tasks</p>
          </div>
        </div>
        <div class="The-Box-Inside rounded-3 " id="progress-col">
        </div>
      </div>
    </div>

<div class="col-4 The-columans border border-2 rounded-4  px-4 py-4 ">
      <div class="box Third-box Data">
        <div class="iconAnd-type d-flex ">
          <div class="toDo-icon px-1 py-1 bg-light rounded-3 "><i class="fa-solid correct-icon fa-circle-check text-emerald-500 text-lg fs-5 py-2 px-2 rounded-3"></i></div>
          <div class="toDo-Word ms-2 ">
            <h6 class="m-0 fw-bold">Completed</h6>
            <p class="m-0 text-secondary ">tasks</p>
          </div>
        </div>
        <div class="The-Box-Inside rounded-3 " id="completed-col">
          </div>
        </div>
        </div>
      </div>

    <div class="row d-flex flex-column align-items-center mt-5">
        <div class="col-md-6 text-center">
            
            <div class="mb-2">
                <i class="fa-regular folder fa-folder-open"></i>
            </div>
            
            <h2 class="h4 empty-state-title mb-1">No tasks yet</h2>
            
            <p class="lead  empty-state-text">Click + to add one</p>
            
        </div>
    </div>
</div> -->
    </div>
  </div>
</div>
</section>
<footer class="main-footer">
    <p>Made with <span class="heart">❤️</span> by Route Academy</p>
</footer>

  
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/Js.js"></script>
  </body>
</html>
